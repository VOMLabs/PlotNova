name: PlotNova
version: "${version}"
description: "Paper-first plot management plugin for Minecraft."
authors:
  - ItzzMateo
  - Citymonstret
  - Empire92
  - MattBDev
  - dordsor21
  - NotMyFault
  - SirYwell
website: "https://github.com/IntellectualSites/PlotSquared"

main: "com.plotsquared.paper.PaperPlatform"
api-version: "1.21"

# Load order
load-before:
  - "MultiWorld"
  - "Multiverse-Core"

# Dependencies
dependencies:
  hard:
    - "worldedit: '*'"
  soft:
    - "vault: '*'"
    - "placeholderapi: '*'"
    - "miniplaceholders: '*'"
    - "fancyworlds: '*'"
    - "essentials: '*'"
    - "luckperms: '*'"
    - "bungeeperms: '*'"
    - "mvdwplaceholderapi: '*'"

# Paper-specific settings
paper:
  autoreload: false
  unsafe-targeting: false

# Commands
commands:
  plots:
    description: "Plot management command."
    usage: "/plots"
    permission: "plots.use"
    aliases:
      - "p"
      - "plot"
      - "ps"
      - "plotsquared"
      - "pn"
      - "plotnova"

# Permissions
permissions:

  # ── Player permissions ──────────────────────────────────────────
  plots.use:
    default: true

  # ── Projectile permissions ──────────────────────────────────────
  plots.projectile.unowned:
    default: op
  plots.projectile.other:
    default: op

  # ── Toggle permissions ──────────────────────────────────────────
  plots.toggle.titles:
    default: op
  plots.toggle.chat:
    default: op
  plots.toggle.time:
    default: op

  # ── Merge permissions ──────────────────────────────────────────
  plots.merge.other:
    default: op
  plots.merge.keeproad.denied:
    default: op

  # ── Trust permissions ──────────────────────────────────────────
  plots.trust.everyone:
    default: op
  plots.deny.everyone:
    default: op

  # ── Area permissions ───────────────────────────────────────────
  plots.area.create:
    default: op
  plots.area.info:
    default: op
  plots.area.list:
    default: op
  plots.area.regen:
    default: op
  plots.area.tp:
    default: op

  # ── Auto/mega permissions ──────────────────────────────────────
  plots.auto.mega:
    default: op
  plots.continue:
    default: op

  # ── Cluster permissions ────────────────────────────────────────
  plots.cluster:
    default: op
  plots.cluster.list:
    default: op
  plots.cluster.create:
    default: op
  plots.cluster.create.other:
    default: op
  plots.cluster.size:
    default: op
  plots.cluster.delete.other:
    default: op
  plots.cluster.resize:
    default: op
  plots.cluster.resize.other:
    default: op
  plots.cluster.resize.shrink:
    default: op
  plots.cluster.resize.expand:
    default: op
  plots.cluster.invite:
    default: op
  plots.cluster.invite.other:
    default: op
  plots.cluster.kick:
    default: op
  plots.cluster.kick.other:
    default: op
  plots.cluster.leave:
    default: op
  plots.cluster.tp:
    default: op
  plots.cluster.tp.other:
    default: op
  plots.cluster.sethome:
    default: op
  plots.cluster.sethome.other:
    default: op
  plots.cluster.command.continue:
    default: op

  # ── Set permissions ────────────────────────────────────────────
  plots.set:
    default: op
  plots.set.alias:
    default: op
  plots.set.biome:
    default: op
  plots.set.border:
    default: op
  plots.set.floor:
    default: op
  plots.set.air:
    default: op
  plots.set.all:
    default: op
  plots.set.home:
    default: op
  plots.set.main:
    default: op
  plots.set.middle:
    default: op
  plots.set.outline:
    default: op
  plots.set.wall:
    default: op
  plots.set.flag:
    default: op
  plots.set.flag.other:
    default: op

  # ── Flag permissions ───────────────────────────────────────────
  plots.flag.list:
    default: op
  plots.flag.remove:
    default: op

  # ── List permissions ───────────────────────────────────────────
  plots.list.all:
    default: op
  plots.list.area:
    default: op
  plots.list.done:
    default: op
  plots.list.expired:
    default: op
  plots.list.forsale:
    default: op
  plots.list.fuzzy:
    default: op
  plots.list.mine:
    default: op
  plots.list.player:
    default: op
  plots.list.shared:
    default: op
  plots.list.top:
    default: op
  plots.list.unowned:
    default: op
  plots.list.world:
    default: op
  plots.target:
    default: op

  # ── Visit permissions ──────────────────────────────────────────
  plots.visit.denied:
    default: op
  plots.visit.other:
    default: op
  plots.visit.owned:
    default: op
  plots.visit.shared:
    default: op
  plots.visit.unowned:
    default: op
  plots.home:
    default: op

  # ── Schematic permissions ──────────────────────────────────────
  plots.schematic.list:
    default: op
  plots.schematic.paste:
    default: op
  plots.schematic.save:
    default: op

  # ── Comment permissions ────────────────────────────────────────
  plots.comment:
    default: op

  # ── Alias permissions ──────────────────────────────────────────
  plots.alias.remove:
    default: op

  # ── Backup permissions ─────────────────────────────────────────
  plots.backup:
    default: op
  plots.backup.list:
    default: op
  plots.backup.load:
    default: op
  plots.backup.save:
    default: op

  # ── Rate permissions ───────────────────────────────────────────
  plots.rate:
    default: op

  # ── Template permissions ───────────────────────────────────────
  plots.template:
    default: op
  plots.template.export:
    default: op
  plots.template.import:
    default: op

  # ── Download permissions ───────────────────────────────────────
  plots.download.world:
    default: op

  # ── Component permissions ──────────────────────────────────────
  plots.components:
    default: op

  # ── Bypass permissions ─────────────────────────────────────────
  plots.teleport.delay.bypass:
    default: op
  plots.worldedit.bypass:
    default: op
  plots.gamemode.bypass:
    default: op
  plots.confirm.bypass:
    default: op
  plots.flag.notify-enter.bypass:
    default: op
  plots.flag.notify-leave.bypass:
    default: op

  # ── Admin permission tree ──────────────────────────────────────
  plots.admin:
    default: false
    children:
      # Command permissions
      plots.admin.command.add: true
      plots.admin.command.blocked-cmds.road: true
      plots.admin.command.blocked-cmds.shared: true
      plots.admin.command.chatspy: true
      plots.admin.command.clear: true
      plots.admin.command.continue: true
      plots.admin.command.delete: true
      plots.admin.command.deny: true
      plots.admin.command.done: true
      plots.admin.command.download: true
      plots.admin.command.kick: true
      plots.admin.command.load: true
      plots.admin.command.merge: true
      plots.admin.command.purge.ratings: true
      plots.admin.command.remove: true
      plots.admin.command.save: true
      plots.admin.command.schematic: true
      plots.admin.command.schematic.paste: true
      plots.admin.command.schematic.save: true
      plots.admin.command.setowner: true
      plots.admin.command.trust: true
      plots.admin.command.unlink: true
